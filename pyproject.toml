[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "scdori"
dynamic = [ "version" ]
description = "scDoRI (single-cell Deep multi-Omic Regulatory Inference) is a deep learning model to infer enhancer-mediated gene regulatory networks (eGRNs) from single-cell multiome data (RNA + ATAC)."
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Manu Saraswat", email = "manu.saraswat10@gmail.com" },
]
authors = [
  { name = "Manu Saraswat", email = "manu.saraswat10@gmail.com" },
]
requires-python = ">=3.10,<3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anndata>=0.10,<0.12",
  "numpy>=1.24,<2",
  "pandas>=1.5,<3",  # AnnData 0.11 cannot write pandas 3 ArrowStringArray metadata
  "scikit-learn>=1.2",
  "scipy>=1.10,<1.17",  # AnnData 0.11 backed sparse indexing uses removed SciPy internals
  "torch>=2.1",
  "tqdm",
]
optional-dependencies.preprocessing = [
  "gtfparse>=2.5,<3", # 2.8.1 produced the published example; 3.x is not checked on real data
  "pyarrow<26", # pyarrow 26 needs NumPy 2, and scDORI pins NumPy <2
  "pynndescent<0.7", # scanpy 1.11 calls getnnz, which the sparse arrays from pynndescent 0.7 lack
  "harmonypy>=0.0.10,<0.1", # Scanpy 1.10/1.11 expects the original Z_corr orientation
  "scanpy>=1.10,<1.12",
  "tangermeme>=0.4.0,<0.5",
  "leidenalg",
]
optional-dependencies.plot = [
  "matplotlib",
  "pynndescent<0.7", # scanpy 1.11 calls getnnz, which the sparse arrays from pynndescent 0.7 lack
  "scanpy>=1.10,<1.12",
  "seaborn",
  "umap-learn",
]
optional-dependencies.notebook = [
  "ipykernel",
  "ipython",
  "jupyter",
  "session-info2",
]
optional-dependencies.all = [
  "scdori[preprocessing,plot,notebook,downstream]",
]
optional-dependencies.dev = [
  "pre-commit",
  "twine>=4.0.2",
]
optional-dependencies.doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  # Until pybtex >0.24.0 releases: https://bitbucket.org/pybtex-devs/pybtex/issues/169/
  "setuptools",
  "sphinx>=4",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxcontrib-bibtex>=1",
  "sphinxext-opengraph",
]
optional-dependencies.downstream = [
  "scdori[plot]",
  "decoupler>=1.8,<1.9", # notebook uses the v1 API and NumPy <2
]
optional-dependencies.test = [
  "coverage",
  "pytest",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://scdori.readthedocs.io/"
urls.Homepage = "https://github.com/bioFAM/scdori"
urls.Source = "https://github.com/bioFAM/scdori"

[tool.hatch.build.hooks.vcs]
version-file = "src/scdori/_version.py"

[tool.hatch.version]
source = "vcs"
fallback-version = "2.0.0"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.default]
installer = "uv"
features = [ "dev" ]

[tool.hatch.envs.docs]
features = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

[tool.hatch.envs.hatch-test]
features = [ "test", "preprocessing", "plot" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]

format.skip-magic-trailing-comma = true
format.exclude = [ "*.ipynb" ]
format.docstring-code-format = true

lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."docs/extensions/*" = [ "D" ]
lint.per-file-ignores."docs/notebooks/*" = [ "D", "F403", "F405" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]

[tool.coverage.run]
source = [ "scdori" ]
omit = [
  "**/test_*.py",
]

[tool.cruft]
skip = [
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
